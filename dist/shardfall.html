<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen {
    margin: 0; color: #c8c8d0; font-size: 16px; line-height: 1.15; white-space: pre;
    font-family: "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono",
      "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", monospace;
    user-select: none; -webkit-user-select: none; cursor: default; touch-action: manipulation;
  }
  #screen span[data-r] { cursor: pointer; }
</style>
</head>
<body>
<pre id="screen">Loading SHARDFALL...</pre>
<!-- Plain scripts (not modules) so the game runs straight from file://.
     manifest.js lists every other file; boot.js loads them in order. -->
<script>
'use strict';
/* =====================================================================
   SHARDFALL - registry.js
   The first file loaded. Creates the global SF namespace that every
   other file plugs into:

     SF.define('enemies', { slime: {...}, wolf: {...} })   add content
     SF.set('rules', {...})                                 set a singleton
     SF.data.enemies.slime                                  read content

   Content files (content/**) only ever call define/set. Engine files
   (src/engine/**) read SF.data. UI files (src/ui/**) read both.
   ===================================================================== */
var SF = (function () {
  // Every kind of content the game knows about. Adding a new kind = add it here.
  const KINDS = [
    'tiles', 'elements', 'regions', 'maps', 'enemies', 'moves', 'weapons', 'skills', 'spells',
    'items', 'shops', 'npcs', 'dialogues', 'quests', 'sprites', 'cosmetics',
  ];
  const SINGLETONS = ['rules', 'stats', 'rarity', 'pity', 'looks'];

  const data = {};
  for (const k of KINDS) data[k] = {};

  const problems = [];   // filled by define() and validate.js
  let currentFile = '';

  function define(kind, entries) {
    if (!data[kind]) { problems.push(`[${currentFile}] unknown content kind "${kind}"`); return; }
    for (const [id, entry] of Object.entries(entries)) {
      if (data[kind][id]) problems.push(`[${currentFile}] duplicate ${kind} id "${id}" (first defined in ${data[kind][id].src})`);
      data[kind][id] = Object.assign({ id, src: currentFile }, entry);
      if (kind === 'sprites') prepSprite(data[kind][id]);
    }
  }

  // Sprites may be written as String.raw`...` blocks: turn them into arrays
  // of lines and strip the indentation they all share.
  function artLines(a) {
    if (Array.isArray(a)) return a.slice();
    const L = String(a).replace(/\r/g, '').split('\n');
    if (L.length && L[0].trim() === '') L.shift();                // newline after the opening backtick
    if (L.length && L[L.length - 1].trim() === '') L.pop();       // newline before the closing backtick
    return L.map((l) => l.replace(/\s+$/, ''));
  }
  function prepSprite(sp) {
    const frames = (sp.frames || [sp.art]).filter(Boolean).map(artLines);
    const indents = frames.flat().filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length);
    const cut = indents.length ? Math.min(...indents) : 0;
    sp.frames = frames.map((f) => f.map((l) => l.slice(cut)));
    sp.frames = sp.frames.map((f) => f.map((l) => [...l]));                 // arrays of characters (Unicode-safe)
    sp.w = Math.max(0, ...sp.frames.flat().map((l) => l.length));
    sp.h = Math.max(0, ...sp.frames.map((f) => f.length));
    if (sp.bands && cut) sp.bands = sp.bands.map(([a, b, c]) => [a - cut, b - cut, c]);
  }

  function set(name, value) {
    if (!SINGLETONS.includes(name)) problems.push(`[${currentFile}] unknown singleton "${name}"`);
    data[name] = value;
  }

  /* ---------- Small helpers content files may use ---------- */
  const util = {
    // Repeat a string: rep('#', 10)
    rep: (s, n) => s.repeat(n),
    // Mirror a sprite left<->right (swaps / \ ( ) < > [ ] { }).
    mirror(lines) {
      const SW = { '/': '\\', '\\': '/', '(': ')', ')': '(', '<': '>', '>': '<', '[': ']', ']': '[', '{': '}', '}': '{', 'd': 'b', 'b': 'd', 'p': 'q', 'q': 'p' };
      const w = Math.max(...lines.map((l) => l.length));
      return lines.map((l) => [...l.padEnd(w)].reverse().map((c) => SW[c] || c).join(''));
    },
  };

  return {
    data, define, set, util, problems, KINDS,
    // The loader calls this before each file so error messages can name the file.
    _file(name) { currentFile = name; },
    E: {},    // engine internals (src/engine/*)
    UI: {},   // ui internals (src/ui/*)
  };
})();

if (typeof module !== 'undefined') module.exports = { SF };

SF._file("content/rules.js");
'use strict';
/* =====================================================================
   Rules: the numbers that set the pace of the whole game.
   Tweak these first when balancing.
   ===================================================================== */
SF.set('rules', {
  // --- Character growth -------------------------------------------------
  baseStat: 4,             // every stat starts here
  startPoints: 3,          // points to spend at character creation
  pointsPerLevel: 1,       // points per level-up (was 3: too fast)
  shardsPerLevel: 3,       // spirit shards per level-up (cosmetics currency)

  // XP needed to go from level L to L+1 = xpBase * L ^ xpExp
  xpBase: 28,
  xpExp: 1.55,

  // --- Anti-grind / pro-exploration ------------------------------------
  // Enemies more than `outlevelGrace` levels below you give less XP:
  // -25% per extra level, never below 10%.
  outlevelGrace: 2,
  outlevelStep: 0.25,
  outlevelMin: 0.1,
  firstKillBonus: 1.0,     // first kill of a new species: +100% XP
  discoverXp: 12,          // XP for entering a new area (multiplied by the area's tier)
  vistaXp: 20,             // XP for reaching a lookout point

  // --- Economy -----------------------------------------------------------
  startGold: 30,
  startShards: 10,
  pullCost: 10,            // shards per shrine echo
  dropChance: 0.08,        // chance an enemy drops an item
  drops: ['hp_potion', 'hp_potion', 'st_tonic', 'sp_draught'],
  deathGoldLoss: 0.25,

  // --- Starting kit --------------------------------------------------------
  start: { map: 'village', weapon: 'wooden_sword', inv: { hp_potion: 3, sp_draught: 1 } },
  maxSanity: 100,

  // --- Combat feel -----------------------------------------------------------
  // Timed strikes: how hard you hit depending on where you stop the strike bar.
  timing: { perfect: 1.35, good: 1.0, weak: 0.7, perfectCrit: 0.25 },
  // Defending: normal damage taken, damage taken vs a telegraphed heavy move,
  // and the counter-attack you get for reading it right.
  guard: { normal: 0.5, perfect: 0.2, riposte: 0.6 },
  critMult: 1.75,
  weakMult: 1.5,           // damage vs an element the enemy is weak to
  resistMult: 0.5,         // damage vs an element the enemy resists
});

/* =====================================================================
   Terrain. Each key is the character used when drawing maps (keep those
   plain ASCII so maps stay easy to type); `g` is what's shown on screen
   and can be any Unicode symbol EXCEPT emoji.
     c / bg  colors              vary    random brightness per tile (texture)
     block   can't walk onto it  opaque  blocks line of sight
     danger  encounter rate multiplier   climb   stamina cost to enter
     ledge   one-way: hop down (south) over it, can't climb back
     msg     message shown when you bump into it
   Special things (people, chests, stairs, exits) are NOT tiles: each
   map places them with its own `legend`; their looks are in looks.js.
   ===================================================================== */

SF._file("src/engine/core.js");
'use strict';
/* =====================================================================
   SHARDFALL engine - core.js
   Shared plumbing for every engine file: seeded RNG, the message log,
   and the per-action result object.

   Engine rules (all files in src/engine/):
     - no DOM, no timers, no Math.random()
     - all game state lives in one plain-JSON object `s`
     - same state + same action = same result (seeded RNG in s.rng)
   ===================================================================== */
(function () {
  const E = SF.E;
  E.D = SF.data;
  E.R = SF.data.rules;

  /* ---------- Seeded RNG (mulberry32). State lives in s.rng ---------- */
  E.rnd = function (s) {
    let t = (s.rng = (s.rng + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  E.roll = (s, a, b) => a + Math.floor(E.rnd(s) * (b - a + 1));
  E.chance = (s, p) => E.rnd(s) < p;
  E.vary = (s, lo, hi) => lo + E.rnd(s) * (hi - lo);
  E.pickOne = (s, arr) => arr[Math.floor(E.rnd(s) * arr.length)];
  E.pickWeighted = function (s, pairs) {
    let total = 0;
    for (const [, w] of pairs) total += w;
    let r = E.rnd(s) * total;
    for (const [k, w] of pairs) if ((r -= w) < 0) return k;
    return pairs[pairs.length - 1][0];
  };

  /* ---------- Log & action result ----------
     Log lines use color markup: {r} {g} {b} {c} {m} {y} {o} {w} {d}(dim),
     {#rrggbb} for any color, {/} closes. */
  E.OUT = null;   // result of the action being processed: { ok, msg, fx: [] }
  E.CUR = null;   // state of the action being processed

  E.log = function (s, text) {
    s.log.push(text);
    if (s.log.length > 150) s.log.splice(0, s.log.length - 150);
  };
  E.logOnce = function (s, text) { if (s.log[s.log.length - 1] !== text) E.log(s, text); };

  E.fail = function (msg) {
    if (E.OUT) { E.OUT.ok = false; E.OUT.msg = msg; }
    if (E.CUR && msg) E.logOnce(E.CUR, `{d}${msg}{/}`);
    return false;
  };

  // Animation hints for the UI. `n` = how many log lines existed when this
  // happened, so the UI can reveal the log in step with its animations.
  E.fx = function (e) {
    if (!E.OUT) return;
    e.n = E.CUR ? E.CUR.log.length : 0;
    E.OUT.fx.push(e);
  };

  E.listNames = (a) => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);
  E.DIRS = [[0, 1], [0, -1], [1, 0], [-1, 0]];
})();

'use strict';
/* =====================================================================
   SHARDFALL engine - validate.js
   Checks every cross-reference in the content once at startup, so a
   typo in an id shows up as a clear message instead of a crash later.
   Problems go to SF.problems (and the browser console). Run
   `node tools/check.js` to see them without opening the game.
   ===================================================================== */
(function () {
  const D = SF.data, P = SF.problems;
  const has = (kind, id) => !!(D[kind] && D[kind][id]);
  const where = (x) => (x && x.src ? `[${x.src}] ` : '');
  const bad = (x, msg) => P.push(where(x) + msg);

  // --- maps ---
  const KINDS = ['go', 'npc', 'shrine', 'chest', 'stone', 'vista', 'sign', 'boss', 'secret'];
  for (const [mk, m] of Object.entries(D.maps)) {
    if (!Array.isArray(m.rows) || !m.rows.length) { bad(m, `map "${mk}" has no rows`); continue; }
    const W = m.rows[0].length;
    m.rows.forEach((row, y) => { if (row.length !== W) bad(m, `map "${mk}" row ${y} is ${row.length} wide, expected ${W}`); });
    const legend = m.legend || {};
    for (const [ch, o] of Object.entries(legend)) {
      if (D.tiles[ch]) bad(m, `map "${mk}" legend "${ch}" shadows a terrain tile; pick another letter`);
      const kind = KINDS.find((k) => o[k] != null);
      if (!kind) bad(m, `map "${mk}" legend "${ch}" has no known type (${KINDS.join(', ')})`);
      if (o.npc && !has('npcs', o.npc)) bad(m, `map "${mk}" legend "${ch}": unknown npc "${o.npc}"`);
      if (o.boss && !has('enemies', o.boss)) bad(m, `map "${mk}" legend "${ch}": unknown boss "${o.boss}"`);
      if (o.chest) {
        const c = o.chest;
        if (c.item && !has('items', c.item)) bad(m, `map "${mk}" chest: unknown item "${c.item}"`);
        if (c.weapon && !has('weapons', c.weapon)) bad(m, `map "${mk}" chest: unknown weapon "${c.weapon}"`);
        if (c.learn && !has('skills', c.learn) && !has('spells', c.learn)) bad(m, `map "${mk}" chest: unknown ability "${c.learn}"`);
      }
      if (o.go) {
        const [to, mark] = String(o.go).split(':');
        const dm = D.maps[to];
        if (!dm) bad(m, `map "${mk}" legend "${ch}": goes to unknown map "${to}"`);
        else if (!dm.rows.some((r) => r.includes(mark))) bad(m, `map "${mk}" legend "${ch}": map "${to}" has no "${mark}" marker`);
        else if (!(dm.legend && dm.legend[mark] && String(dm.legend[mark].go).split(':')[0] === mk)) {
          bad(m, `map "${mk}" -> "${to}": the "${mark}" marker in "${to}" doesn't lead back here`);
        }
      }
    }
    m.rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (!D.tiles[ch] && !legend[ch]) bad(m, `map "${mk}" unknown character "${ch}" at ${x},${y}`);
    }));
    for (const [ek] of m.enc || []) if (!has('enemies', ek)) bad(m, `map "${mk}" encounter: unknown enemy "${ek}"`);
    if (m.region && !has('regions', m.region)) bad(m, `map "${mk}": unknown region "${m.region}"`);
  }
  for (const [rk, r] of Object.entries(D.regions)) {
    for (const mk of r.levels || []) if (!D.maps[mk]) bad(r, `region "${rk}" lists unknown map "${mk}"`);
  }
  if (!D.maps[D.rules.start.map] || !D.maps[D.rules.start.map].start) P.push(`rules.start.map "${D.rules.start.map}" must be a map with a start: [x, y]`);

  // --- combat content ---
  for (const [id, e] of Object.entries(D.enemies)) {
    const lists = [e.moves].concat(e.phase2 ? [e.phase2.moves] : []);
    for (const list of lists) for (const [mv] of list || []) if (!has('moves', mv)) bad(e, `enemy "${id}": unknown move "${mv}"`);
    if (!has('sprites', e.sprite || id)) bad(e, `enemy "${id}": no sprite "${e.sprite || id}"`);
    for (const el of [].concat(e.weak || [], e.resist || [])) if (!has('elements', el)) bad(e, `enemy "${id}": unknown element "${el}"`);

  for (const [id, mv] of Object.entries(D.moves)) {

/* =====================================================================
   SHARDFALL engine - stats.js

   weapon. Since stat points are scarce now (1 per level), levels also

      maxSt: 20 + S.sta * 5 + (L - 1) * 2,

      resist: Math.min(0.3, S.vit * 0.012),             // fraction of damage ignored

      stRegen: 2 + Math.floor(S.sta / 3),
      spRegen: 1 + Math.floor(S.spi / 4),
      power: S.spi + Math.floor((L - 1) / 2),           // spell scaling
      brink: S.wil * 3,                                 // you fall at -brink HP
      furyBonus: S.wil * 0.02,                          // +damage when under 35% HP

/* =====================================================================
   SHARDFALL engine - world.js
   Maps, movement and exploration:
     - any map size (the UI scrolls); terrain from content/tiles.js

     - vertical travel between altitude levels (regions in content/regions.js)

/* =====================================================================

   Conversations (content/story/**). A dialogue picks its first entry
   whose quest conditions match, then follows choices node to node.

    const p = s.p;
    const entry = dl.entry.find((en) => !en.if || Object.entries(en.if).every(([q, st]) => E.qStatus(p, q) === st));
    s.dialog = { id, node: entry.node };

    return {

      text: node.text.replace(/%(\w+)%/g, (_, q) => E.questProgress(s.p, q)),
      choices: node.choices.map((c) => c.t),

  };

  E.choose = function (s, a) {
    const dl = D.dialogues[s.dialog.id], node = dl.nodes[s.dialog.node], ch = node.choices[a.i];

          p.quests[v] = { s: 'active', n: 0 };
          E.log(s, `{y}New quest:{/} ${q.name}. ${q.desc}`);
        }
        break;
      case 'ready':
        E.setReady(s, v);
        break;
      case 'turnin': {
        const st = p.quests[v];
        if (!q || !st || st.s !== 'ready') break;
        st.s = 'done';
        const rw = q.reward;
        p.gold += rw.gold || 0;
        p.shards += rw.shards || 0;
        const parts = [rw.gold && `{y}+${rw.gold} gold{/}`, rw.shards && `{m}+${rw.shards} shards{/}`, rw.xp && `+${rw.xp} XP`].filter(Boolean);

        p.flags[v] = true;
        break;
      case 'rest': {
        const cost = Number(v) || 0;

        break;

      case 'calm': {

        p.san = Math.min(d.maxSan, p.san + (Number(v) || 0));

'use strict';
/* =====================================================================
   SHARDFALL engine - shrine.js
   The Shrine of Echoes: spend spirit shards on cosmetic "echoes"
   (glyphs, colors, titles, frames). Pity timers guarantee Epic and
   Legendary pulls; duplicates refund shards. Cosmetics never affect stats.
   ===================================================================== */

  const E = SF.E, D = E.D, R = E.R;
  const COS = {};
  for (const c of Object.values(D.cosmetics)) COS[c.id] = c;
  const POOLS = D.rarity.map((_, r) => Object.values(D.cosmetics).filter((c) => c.r === r && !c.def));
  E.COS = COS;

  function rollRarity(s, min) {
    return E.pickWeighted(s, D.rarity.map((r, i) => [i, i >= min ? r.weight : 0]).filter(([, w]) => w > 0));
  }
  const cosName = (id) => `{${D.rarity[COS[id].r].color}}${COS[id].name}{/} {d}(${COS[id].type}){/}`;

  E.pull = function (s, a) {
    const p = s.p, n = a.n === 10 ? 10 : 1, cost = R.pullCost * n;
    if (p.shards < cost) return E.fail(`You need ${cost} spirit shards (you have ${p.shards}).`);
    p.shards -= cost;
    const results = [];
    for (let i = 0; i < n; i++) {
      p.pity.e++; p.pity.l++; p.pulls++;
      let r = p.pity.l >= D.pity.legendary ? 3 : rollRarity(s, p.pity.e >= D.pity.epic ? 2 : 0);
      while (r > 0 && !POOLS[r].length) r--;
      if (r >= 2) p.pity.e = 0;
      if (r === 3) p.pity.l = 0;

      else p.cos.push(c.id);
      results.push({ id: c.id, r, dupe, refund });
    }
    const fresh = results.filter((x) => !x.dupe).map((x) => cosName(x.id));
    const refunded = results.reduce((t, x) => t + x.refund, 0);
    E.log(s, `{m}The shrine answers with ${n} echo${n > 1 ? 'es' : ''}.{/}` +
      (fresh.length ? ` New: ${fresh.join(', ')}.` : ' Nothing new.') +
      (refunded ? ` {d}Duplicates refunded ${refunded} shards.{/}` : ''));
    E.fx({ t: 'pull', results });

  };

  E.wearCosmetic = function (s, a) {
    const p = s.p, c = COS[a.id];
    if (!c || !p.cos.includes(a.id)) return E.fail("You don't own that.");
    p.look[c.type] = a.id;

    return true;
  };

      title: t ? t.name : '',

})();

/* =====================================================================
   SHARDFALL engine - state.js

   ===================================================================== */
(function () {

    const stats = {};

      stats[k] = R.baseStat + a;
      used += a;
    }

    const look = {};
    for (const c of Object.values(D.cosmetics)) if (c.def) look[c.type] = c.id;
    const start = D.maps[R.start.map];
    const p = {
      name: String(opts.name || '').replace(/[{}%<>]/g, '').trim().slice(0, 14) || 'Wanderer',
      lvl: 1, xp: 0, points: R.startPoints - used, stats,
      hp: 0, st: 0, sp: 0, san: R.maxSanity,
      gold: R.startGold, shards: R.startShards,
      weapon: R.start.weapon, weapons: [R.start.weapon],
      inv: Object.assign({}, R.start.inv),
      quests: {}, flags: {}, known: {}, journal: {}, visited: {}, poison: null, stones: 0,
      cos: Object.values(D.cosmetics).filter((c) => c.def).map((c) => c.id), look, pity: { e: 0, l: 0 },
      map: R.start.map, x: start.start[0], y: start.start[1],
      acc: { hp: 0, st: 0, sp: 0, san: 0 }, grace: 0,
      kills: 0, steps: 0, deaths: 0, pulls: 0,
    };
    const d = E.derived(p);
    p.hp = d.maxHp; p.st = d.maxSt; p.sp = d.maxSp;
    p.visited[R.start.map] = 1;
    E.syncBag(p);
    const s = { v: SAVE_VERSION, seed, rng: seed | 0, scene: 'explore', p,
      world: { gone: {}, used: {}, seen: {} }, combat: null, dialog: null, shop: null, dead: null, log: [] };
    E.invalidateFov();
    E.reveal(s);
    E.log(s, '{d}Three nights ago, the sky cracked like ice.{/}');
    E.log(s, `You wake beside the fountain of {y}Emberhollow{/}, ${p.name}. You remember your name, and nothing else.`);
    E.log(s, 'Elder Maren ({y}☺{/}) is waiting nearby. Walk into people to talk to them.');
    return s;
  };

  E.save = (s) => JSON.stringify(s);

  E.load = function (json) {

    if (s.v === 1) s = migrateV1(s);
    if (s.v !== SAVE_VERSION) throw new Error(`Save version ${s.v} is not supported`);

    if (!p.weapons.length) p.weapons = [R.start.weapon];

      log: ['{d}Your old save was carried over. The world has changed while you were away.{/}'] };
  }
})();

/* =====================================================================
   SHARDFALL engine - api.js
   The only thing the UI (or a future server) talks to:

     const res = Engine.act(state, { type: 'move', dx: 1, dy: 0 });
     // res = { ok, msg, fx: [...] }    state is updated in place

   ACTIONS                              allowed in scene(s)
     move     {dx, dy}                  explore  (walking into things = interact)
     attack   {target, q}               combat   q = perfect | good | weak (strike bar)
     skill    {id, target, q}           combat   sword skills, cost stamina
     spell    {id, target}              combat   spells, cost spirit
     defend / flee                      combat
     use      {id}                      explore, combat, shop
     equip    {id}                      explore, shop
     alloc    {stat}                    explore, shop, shrine, dialog
     cosmetic {id}                      explore, shop, shrine, dialog
     choose   {i}                       dialog
     buy {id} / sell {id}               shop
     pull     {n: 1 | 10}               shrine
     leave                              dialog, shop, shrine
     respawn                            gameover
     arrange  {from, to}                any but gameover   swap two bag slots

   FX (animation hints, each has n = log length when it happened):
     start act ehit eheal phit hhit emove dodge kill burn freeze frozen
     dread steal sap poison phase heal win lose flee level pull travel
     hop strain secret chest stone vista buy
   ===================================================================== */

  const E = SF.E, D = E.D;

  const NOT_COMBAT = ['explore', 'shop', 'shrine', 'dialog'];
  const HANDLERS = {
    move:     [['explore'], E.move],
    attack:   [['combat'], E.combatTurn],
    skill:    [['combat'], E.combatTurn],
    spell:    [['combat'], E.combatTurn],
    defend:   [['combat'], E.combatTurn],
    flee:     [['combat'], E.combatTurn],
    use:      [['explore', 'combat', 'shop'], E.useItem],
    equip:    [['explore', 'shop'], E.equip],

    cosmetic: [NOT_COMBAT, E.wearCosmetic],
    choose:   [['dialog'], E.choose],
    buy:      [['shop'], E.buy],
    sell:     [['shop'], E.sell],
    pull:     [['shrine'], E.pull],
    leave:    [['dialog', 'shop', 'shrine'], E.leave],
    arrange:  [['explore', 'shop', 'shrine', 'dialog', 'combat'], E.arrange],

/* =====================================================================
   SHARDFALL ui - scenes/explore.js
   The map panel: a window onto maps of any size (the camera follows you
   on big maps; small maps are centered). Tiles get a little random
   brightness for texture, water shimmers and crystals pulse. Moving
   between altitude levels slides the new map in from above or below.
   ===================================================================== */
(function () {
  const U = SF.UI, ui = U.ui;
  const V = U.L.VIEW;

  // Camera: map cell shown at the top-left of the view.
  U.camera = function (s) {
    const m = Engine.map(s), p = s.p;
    const cx = m.W <= V.w ? -Math.floor((V.w - m.W) / 2) : Math.max(0, Math.min(m.W - V.w, p.x - Math.floor(V.w / 2)));
    const cy = m.H <= V.h ? -Math.floor((V.h - m.H) / 2) : Math.max(0, Math.min(m.H - V.h, p.y - Math.floor(V.h / 2)));
    return { x: cx, y: cy, W: m.W, H: m.H };
  };

  function tileInfo(s, x, y) {
    const m = Engine.map(s);
    if (x < 0 || y < 0 || x >= m.W || y >= m.H) return null;
    if (!Engine.seen(s)[y * m.W + x]) return '{d}Unexplored{/}';
    if (x === s.p.x && y === s.p.y) return `${s.p.name} {d}(you){/}`;
    const c = Engine.cell(s, x, y);
    return c.name + (c.hint ? ` {d}(${c.hint}){/}` : '');
  }

  const SHIMMER = { '≈': '~', '∽': '~' };
  const texCache = {};
  function texture(col, x, y, vary) {
    const h = U.hash(x, y, 3), k = col + Math.round(h * 8);
    return texCache[k] || (texCache[k] = U.mix(col, h < 0.5 ? '#000000' : '#ffffff', Math.abs(Math.round(h * 8) / 8 - 0.5) * 2 * vary));

    const s = ui.s, m = Engine.map(s), p = s.p, vis = Engine.fov(s), seen = Engine.seen(s), cam = U.camera(s), M = U.L.MAP;
    const title = `{c}${m.name}{/} {d}${m.danger}${m.region && m.region.levels.length > 1 ? `  ·  altitude ${m.z}` : ''}{/}`;
    U.box(M.x, M.y, M.w, M.h, title);
    const tr = U.anim.view && U.anim.view.trans;
    // during a level change, slide the map in from where you came (edge exits just fade in)
    const off = tr ? Math.round((1 - tr.t) * (tr.dir === 'up' ? V.h : tr.dir === 'down' ? -V.h : 0)) : 0;
    const fade = tr && tr.dir === 'edge' ? 1 - tr.t : 0;
    U.area(V.x, V.y, V.w, V.h, U.region('map', (sx, sy) => U.walkTo(sx - V.x + cam.x, sy - V.y + cam.y)));
    const shimmer = Math.floor(now / 400);
    for (let sy = 0; sy < V.h; sy++) {
      for (let sx = 0; sx < V.w; sx++) {
        const x = sx + cam.x, y = sy + cam.y + off;
        if (x < 0 || y < 0 || x >= m.W || y >= m.H) continue;
        const i = y * m.W + x;
        if (!seen[i]) continue;
        const c = Engine.cell(s, x, y);
        let g = c.g, col = c.c;
        if (c.shimmer && !c.exit && U.hash(x, y, shimmer) < 0.18) g = SHIMMER[g] || g;
        if (c.vary) col = texture(col, x, y, c.vary);

        if (fade) col = U.mix(col, '#0b0b10', fade);

        U.put(V.x + sx, V.y + sy, g, lit ? col : U.dim(col), c.bg ? (lit ? c.bg : U.dim(c.bg)) : null);
      }
    }
    const L = Engine.look(p);
    if (!tr) U.put(V.x + p.x - cam.x, V.y + p.y - cam.y, L.glyph, L.color);
    if (tr) {
      const verb = tr.dir === 'up' ? '▲ climbing ▲' : tr.dir === 'down' ? '▼ descending ▼' : '';
      if (verb) U.center(V.x + V.w / 2, V.y + 2, ` ${verb} `, U.C.c, U.BANNER_BG);
    }

    // hover: path preview + description along the bottom border
    const hc = ui.hover === 'map' && ui.hcell;
    if (hc && s.scene === 'explore' && !ui.overlay && !tr) {
      const tx = hc.x - V.x + cam.x, ty = hc.y - V.y + cam.y, path = Engine.path(s, tx, ty);
      if (path) {
        let x = p.x, y = p.y;
        for (const [dx, dy] of path) { x += dx; y += dy; U.fillBg(V.x + x - cam.x, V.y + y - cam.y, 1, 1, '#1b2833'); }

      U.fillBg(hc.x, hc.y, 1, 1, U.HOVER_BG);
      const info = tileInfo(s, tx, ty);
      if (info) { const t = ` ${info} `; U.mtext(M.x + M.w - 2 - U.plainLen(t), M.y + M.h - 1, t); }

    if (cam.y + V.h < m.H) U.small(V.x + V.w - 5, V.y + V.h - 0.5, 'more ▼', U.DIM);

    // floats pinned to map tiles
    for (const f of ui.floats) {
      if (f.mx == null || (f.map && f.map !== m.id)) continue;
      const t = (now - f.t0) / f.dur;
      if (t >= 1) continue;
      U.center(V.x + f.mx - cam.x, V.y + f.my - cam.y - 1 - Math.floor(t * 2), f.text, f.color, U.BANNER_BG);
    }
  };
})();

'use strict';
/* =====================================================================
   SHARDFALL ui - scenes/log.js
   The message log (revealed in step with combat animations), the hint
   bar along the bottom, and the big centered banners.
   ===================================================================== */
(function () {
  const U = SF.UI, ui = U.ui;
  const B = U.L.LOG, TW = B.w - 6, ROWS = B.h - 2;
  let cache = { len: -1, from: -1, last: null, lines: [] };

  function logLines(s, upto) {
    const L = s.log, last = L[upto - 1];
    if (cache.len === upto && cache.from === ui.newFrom && cache.last === last && cache.arr === L) return cache.lines;
    const lines = [];
    for (let i = Math.max(0, upto - 60); i < upto; i++) {
      const fresh = i >= ui.newFrom;
      U.wrap(L[i], TW, fresh ? U.FG : '#8a8a96').forEach((ln, k) => lines.push({ ln, mark: k === 0 && fresh ? '›' : ' ' }));
    }
    cache = { arr: L, len: upto, from: ui.newFrom, last, lines };
    return lines;
  }

  U.drawLog = function () {
    const s = ui.s;
    U.box(B.x, B.y, B.w, B.h, 'Log');
    const lines = logLines(s, Math.min(s.log.length, U.anim.logN(s)));
    ui.logScroll = Math.max(0, Math.min(ui.logScroll, lines.length - ROWS));
    const top = Math.max(0, lines.length - ROWS - ui.logScroll);
    for (let r = 0; r < ROWS && top + r < lines.length; r++) {
      const l = lines[top + r];
      U.put(B.x + 2, B.y + 1 + r, l.mark, U.C.y);
      U.drawLine(B.x + 3, B.y + 1 + r, l.ln);
    }
    if (ui.logScroll > 0) U.text(B.x + B.w - 22, B.y + B.h - 1, ` ▼ ${ui.logScroll} newer lines `, U.C.y);
  };

  U.drawBar = function () {
    const s = ui.s, y = U.L.BAR;
    let x = 1;
    const btn = (label, key, fn) => { x += U.button(x, y, label, 'bar:' + key, fn) + 2; };
    const hint = (t) => U.mtext(x, y, `{d}${t}{/}`);
    if (U.anim.busy()) return hint('[Space] or click to skip');
    switch (s.scene) {
      case 'explore':
        btn('{y}[I]{/}nventory', 'inv', () => U.openOverlay('inv'));
        btn('{y}[C]{/}haracter', 'char', () => U.openOverlay('char'));
        btn('{y}[J]{/}ournal', 'journal', () => U.openOverlay('journal'));
        btn('{y}[Q]{/}uests', 'quests', () => U.openOverlay('quests'));
        btn('{y}[O]{/}utfits', 'outfit', () => U.openOverlay('outfit'));
        btn('{y}[?]{/} Help', 'help', () => U.openOverlay('help'));
        btn('{y}[Esc]{/} Menu', 'menu', () => U.openOverlay('menu'));

        break;

      case 'shop': hint('[1-9] buy or sell · [Tab] switch tab · [Esc] leave'); break;
      case 'shrine': hint('[1] echo ×1 · [2] echo ×10 · [O] outfits · [Esc] leave'); break;
      case 'gameover': hint('[R] rise again'); break;

    U.text(x, y + 1, ' '.repeat(w), U.FG, U.BANNER_BG);

'use strict';
/* =====================================================================
   SHARDFALL ui - scenes/timing.js
   The strike bar. A marker sweeps back and forth; stop it in the gold
   zone for a PERFECT strike (+35% damage, +25% crit), the green zone for
   a normal hit, anywhere else for a weak one. Each weapon has its own
   speed and zone sizes (content/weapons, `timing`). It can be turned off
   in Menu > Settings.
   ===================================================================== */
(function () {
  const U = SF.UI, ui = U.ui, D = SF.data;
  const V = U.L.VIEW, BX = V.x + 4, BW = V.w - 8, Y = 17;

  function pos(T, now) {
    const ph = (now - T.t0) / T.sweep, m = ph % 2;
    return m < 1 ? m : 2 - m;
  }

  U.resolveTiming = function () {
    const T = ui.timing;
    if (!T || T.done) return;
    const now = performance.now(), p = pos(T, now), dist = Math.abs(p - T.center);
    const q = dist <= T.perfect / 2 ? 'perfect' : dist <= T.good / 2 ? 'good' : 'weak';
    T.done = { q, p, at: now };
    U.render();
    setTimeout(() => {
      if (ui.timing !== T) return;
      ui.timing = null;
      U.doCombat(Object.assign({}, T.a, { q }));
    }, 170);
  };
  U.cancelTiming = function () { ui.timing = null; };

  U.drawTiming = function (now) {
    const T = ui.timing, w = D.weapons[ui.s.p.weapon];
    if (!T.done && now - T.t0 > T.sweep * 2.6) U.resolveTiming();   // too slow: it swings anyway
    const p = T.done ? T.done.p : pos(T, now);
    const what = T.a.type === 'skill' ? D.skills[T.a.id].name : 'Strike';
    U.mtext(V.x + 1, Y, `{y}${what}!{/}  {d}stop the marker in the {/}{#ffd040}gold{/}{d} zone{/}`);
    U.button(V.x + V.w - 13, Y, '{y}[Esc]{/} Cancel', 'tm:cancel', U.cancelTiming);
    const r = U.region('tm:hit', U.resolveTiming);
    U.area(BX - 1, Y + 1, BW + 2, 3, r);
    U.put(BX - 1, Y + 2, '▕', U.DIM); U.put(BX + BW, Y + 2, '▏', U.DIM);
    for (let k = 0; k < BW; k++) {
      const f = (k + 0.5) / BW, d = Math.abs(f - T.center);
      const zone = d <= T.perfect / 2 ? 2 : d <= T.good / 2 ? 1 : 0;
      U.put(BX + k, Y + 2, zone === 2 ? '█' : zone === 1 ? '▆' : '▁', zone === 2 ? '#ffd040' : zone === 1 ? '#5fb85f' : '#3a3a4a', null, r);
    }
    const mx = BX + Math.min(BW - 1, Math.floor(p * BW));
    const mcol = T.done ? (T.done.q === 'perfect' ? '#ffd040' : T.done.q === 'good' ? '#6bdc6b' : '#ff6b6b') : '#ffffff';
    U.put(mx, Y + 1, '▼', mcol); U.put(mx, Y + 3, '▲', mcol); U.put(mx, Y + 2, '┃', mcol, '#2c2c40');
    if (T.done) U.center(V.x + V.w / 2, Y + 5, T.done.q === 'perfect' ? '★ PERFECT! ★' : T.done.q === 'good' ? 'Good hit' : 'Clumsy…', mcol);

      const feel = w.timing && w.timing.sweep < 750 ? 'fast blade, wide sweet spot' : w.timing && w.timing.sweep > 1000 ? 'slow swing, narrow sweet spot' : 'steady swing';

    }
  };
})();

'use strict';
/* =====================================================================
   SHARDFALL ui - overlays/inventory.js   [I]
   A Minecraft-style inventory:
     - 32 backpack slots (the top row is the hotbar: keys 1-8 while exploring)
     - click a slot to pick its item up, click another slot to put it
       there (swapping if it's taken); click the background to put it back
     - right-click: use an item / equip a weapon right away
     - drop a weapon on the EQUIPPED slot to wield it
     - hover for a tooltip; keyboard: arrows, Space = pick up / place,
       Enter = use / equip, Esc = put back / close
   Slot drawing is shared with the Pack panel (scenes/pack.js).
   ===================================================================== */
(function () {
  const U = SF.UI, ui = U.ui, D = SF.data;
  const X = 0, Y = 0, W = 128, H = 41;
  const COLS = 8, ROWS = 4, SW = 9, SH = 5, GX = 50, GY = 5;          // backpack grid
  const EQ = { x: 9, y: 5, w: 36, h: 8 };                               // equipped weapon slot

  const slotXY = (k) => [GX + (k % COLS) * SW, GY + Math.floor(k / COLS) * SH];
  const heldInfo = (bag) => (ui.held != null ? bag[ui.held] : null);

  // Click on a backpack slot.
  function clickSlot(k) {
    const bag = Engine.bag(ui.s);
    ui.invSel = k;
    if (ui.held != null) {
      if (ui.held !== k) U.doAction({ type: 'arrange', from: ui.held, to: k });
      ui.held = null;
    } else if (bag[k]) ui.held = k;
  }
  // Click on the equipped slot (with a weapon in hand = equip it).
  function clickEquip() {
    const bag = Engine.bag(ui.s), h = heldInfo(bag);
    ui.invSel = -1;
    if (!h) return;
    if (h.kind === 'weapon') U.doAction({ type: 'equip', id: h.id });
    else Engine.note(ui.s, `{d}The ${h.name} is not a weapon.{/}`);
    ui.held = null;
  }
  function quick(k) {               // right-click / Enter
    const info = Engine.bag(ui.s)[k];
    ui.held = null;
    if (info) U.itemAction(info);
  }

  U.invClose = function () { ui.held = null; ui.overlay = null; };

  U.invKey = function (k) {
    const n = Engine.BAG_SIZE;
    let sel = ui.invSel == null ? 0 : ui.invSel;
    if (k === 'Escape' || k === 'i') {
      if (ui.held != null) ui.held = null; else U.invClose();
      return true;
    }
    if (k === 'ArrowLeft' || k === 'a') sel = sel === -1 ? -1 : sel % COLS === 0 ? -1 : sel - 1;
    else if (k === 'ArrowRight' || k === 'd') sel = sel === -1 ? 0 : sel % COLS === COLS - 1 ? sel : sel + 1;
    else if (k === 'ArrowUp' || k === 'w') sel = sel === -1 ? -1 : sel - COLS >= 0 ? sel - COLS : sel;
    else if (k === 'ArrowDown' || k === 's') sel = sel === -1 ? -1 : sel + COLS < n ? sel + COLS : sel;
    else if (k === ' ') { if (sel === -1) clickEquip(); else clickSlot(sel); return true; }
    else if (k === 'Enter') { if (sel >= 0) quick(sel); return true; }
    else return false;
    ui.invSel = sel;
    return true;
  };

  U.drawInv = function (now) {
    const s = ui.s, p = s.p, bag = Engine.bag(s), w = D.weapons[p.weapon], d = Engine.derived(p);
    U.box(X, Y, W, H, '{y}Inventory{/}', { bg: U.MODAL_BG });
    U.area(X + 1, Y + 1, W - 2, H - 2, U.region('inv:bg', () => { ui.held = null; }));
    if (ui.invSel == null) ui.invSel = 0;

    // ---- equipped weapon ----
    U.text(EQ.x, Y + 2, 'Equipped', U.C.c);
    const eqHot = U.hovered('inv:weapon'), eqSel = ui.invSel === -1, h = heldInfo(bag);
    const eqCol = h && h.kind === 'weapon' && eqHot ? '#ffd866' : eqSel ? '#ffd866' : eqHot ? '#8a8aa8' : '#34344a';
    U.box(EQ.x, EQ.y, EQ.w, EQ.h, null, { color: eqCol, style: 'single' });
    U.fillBg(EQ.x + 1, EQ.y + 1, EQ.w - 2, EQ.h - 2, eqHot ? '#1a1a28' : '#101018');
    const re = U.region('inv:weapon', clickEquip);
    U.area(EQ.x, EQ.y, EQ.w, EQ.h, re);
    U.drawSprite(w.sprite || p.weapon, EQ.x + Math.floor(EQ.w / 2), EQ.y + EQ.h - 3, { clip: { x0: EQ.x + 1, y0: EQ.y + 1, x1: EQ.x + EQ.w - 2, y1: EQ.y + EQ.h - 2 } });
    U.center(EQ.x + EQ.w / 2, EQ.y + EQ.h - 2, w.name, U.C.w);
    U.small(EQ.x + 1, EQ.y, 'weapon', eqCol);

    // ---- you ----
    let y = EQ.y + EQ.h + 1;
    U.mtext(EQ.x, y++, `${p.name} {d}· level ${p.lvl}{/}`, Engine.look(p).color);
    for (const [lab, v, m, c] of [['HP', p.hp, d.maxHp, U.hpColor(p.hp / d.maxHp)], ['ST', p.st, d.maxSt, '#7ddc6f'], ['SP', p.sp, d.maxSp, '#5ca8ff'], ['SAN', p.san, d.maxSan, '#c792ea']]) {
      U.text(EQ.x, y, lab, U.DIM); U.bar(EQ.x + 4, y, 20, v, m, c); U.small(EQ.x + 25, y + 0.5, `${v}/${m}`, U.DIM); y++;
    }
    U.mtext(EQ.x, y++, `{y}◉ Gold{/} ${p.gold}   {m}◇ Shards{/} ${p.shards}`);
    U.mtext(EQ.x, y++, `{d}Dmg{/} ${d.dmgMin}-${d.dmgMax}   {d}Crit{/} ${U.pct(d.crit)}`);

    // ---- backpack ----
    U.text(GX, Y + 2, 'Backpack', U.C.c);
    U.small(GX + 10, Y + 2.5, `top row = hotbar (keys 1-8)  ·  ${bag.filter((b) => !b).length} free slots`, U.DIM);
    let hot = -2;
    for (let k = 0; k < Engine.BAG_SIZE; k++) {
      const [sx, sy] = slotXY(k), key = 'inv:slot:' + k;
      const r = U.region(key, () => clickSlot(k), () => quick(k));
      if (U.hovered(key)) hot = k;

        hot: U.hovered(key), sel: ui.invSel === k, held: ui.held === k, label: true,

    const focus = hot >= 0 ? bag[hot] : ui.invSel >= 0 ? bag[ui.invSel] : null;
    const DX = EQ.x, DY = 26;

    if (focus) {
      const col = focus.kind === 'weapon' ? '#ffb347' : '#9fd8a0';
      U.drawSprite(focus.icon, DX + 2, DY + 2);
      U.mtext(DX + 6, DY, `{${col}}${focus.name}{/}${focus.count > 1 ? `  {d}×${focus.count}{/}` : ''}  {d}${focus.kind === 'weapon' ? 'weapon' : 'consumable'}{/}`);

        U.drawSprite(fw.sprite || focus.id, DX + 92, DY + 5, { clip: { x0: DX + 76, y0: DY, x1: X + W - 2, y1: DY + 6 } });
      }
      const k = hot >= 0 ? hot : ui.invSel;
      const verb = focus.kind === 'weapon' ? 'Equip' : 'Use';
      U.button(DX + 6, DY + 5, `{y}[Enter]{/} ${verb}`, 'inv:do', () => quick(k));
    } else U.mtext(DX, DY, '{d}Hover or select a slot to see what it is.{/}');
    U.small(DX, Y + H - 2.5, 'click: pick up / put down  ·  right-click: use or equip  ·  drop a weapon on EQUIPPED to wield it  ·  arrows + Space / Enter  ·  [Esc] close', '#6a6a80');

    // ---- the item in your hand follows the mouse; tooltip otherwise ----
    const hc = ui.hcell;
    if (h && hc) {
      U.drawSprite(h.icon, hc.x + 1, hc.y + 1);
      if (h.count > 1) U.small(hc.x + 2.5, hc.y + 1.5, String(h.count), '#ffffff');

  };

  // A small floating tooltip, Minecraft style.
  U.tooltip = function (x, y, info) {
    const col = info.kind === 'weapon' ? '#ffb347' : '#9fd8a0';

  };
})();

  function drawBeasts(now) {

      U.button(X + 2, yy, `${ui.jSel === k ? '{y}►{/}' : ' '} ${label}`, 'jr:' + k, () => (ui.jSel = k),

    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],

      return false;

    else if (k === 'h' || k === '?') ui.titleHelp = true;

    if (k === 'ArrowUp') cr.sel = (cr.sel + n - 1) % n;
    else if (k === 'ArrowDown') cr.sel = (cr.sel + 1) % n;
    else if (k === 'ArrowLeft' || k === '-') U.adjustStat(cr.sel, -1);
    else if (k === 'ArrowRight' || k === '+' || k === '=') U.adjustStat(cr.sel, 1);

    const T = U.OUTFIT_TYPES;
    if (k === 'ArrowUp' || k === 'w') ui.outfitRow = (ui.outfitRow + T.length - 1) % T.length;
    else if (k === 'ArrowDown' || k === 's') ui.outfitRow = (ui.outfitRow + 1) % T.length;
    else if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'd') {

    else if (k === 'ArrowUp' || k === 'w') ui.jSel = (ui.jSel + n - 1) % n;
    else if (k === 'ArrowDown' || k === 's') ui.jSel = (ui.jSel + 1) % n;

        else if (k === 'q') U.openOverlay('quests');

        else if (k === 'j') U.openOverlay('journal');
        else if (k === '?' || k === '/') U.openOverlay('help');

    if (ui.screen === 'game' && U.anim.busy()) { U.anim.skip(); used = true; }
    else if (ui.screen === 'title') used = titleKey(k);
    else if (ui.screen === 'create') used = createKey(e);

'use strict';
/* =====================================================================
   SHARDFALL ui - main.js
   The render loop (on demand: it only keeps redrawing while something
   moves) and startup. Loaded last.
   ===================================================================== */
(function () {
  const U = SF.UI, ui = U.ui;
  let pending = false, timer = null, due = 0;

  U.render = function () {
    if (!pending) { pending = true; requestAnimationFrame(draw); }
  };

  // How soon the next frame is needed (ms), or 0 for "only on input".
  function nextFrame(now) {
    if (ui.screen === 'title') return 90;
    if (ui.screen !== 'game' || !ui.s) return 0;
    if (U.anim.busy() || ui.timing) return 16;
    if (ui.banner && now < ui.banner.until) return 50;
    if (now < ui.pflash || now < ui.shake || ui.floats.length) return 33;
    if (ui.pull && now - ui.pull.t0 < ui.pull.results.length * 140 + 200) return 50;
    if (ui.s.scene === 'combat') return 120;          // idle sprite frames, blinking intents
    if (ui.s.scene === 'explore' && !ui.overlay) return 220;   // water shimmer, glowing crystals
    return 0;
  }

  function drawGame(now) {
    const s = ui.s, scene = U.anim.scene(s);
    if (scene === 'combat') U.drawCombat(now);
    else U.drawMapPanel(now);
    U.drawSide(now);
    U.anim.draw(now);          // effects on top of both panels
    U.drawLog();
    U.drawPack();
    U.drawBar();
    if (!U.anim.busy()) {
      if (s.scene === 'dialog') U.drawDialog();
      else if (s.scene === 'shop') U.drawShop();
      else if (s.scene === 'shrine') U.drawShrine(now);
      else if (s.scene === 'gameover') U.drawGameOver();
    }
    switch (ui.overlay) {
      case 'inv': U.drawInv(now); break;
      case 'char': U.drawChar(); break;
      case 'quests': U.drawQuests(); break;
      case 'journal': U.drawJournal(now); break;
      case 'outfit': U.drawOutfit(); break;
      case 'help': U.drawHelp(); break;
      case 'menu': U.drawMenu(); break;
    }
    U.drawBanner(now);
  }

  function draw() {
    pending = false;
    const now = performance.now();
    U.anim.tick(now);
    ui.floats = ui.floats.filter((f) => now < f.t0 + f.dur);
    U.clear();
    try {
      if (ui.screen === 'title') U.drawTitle(now);
      else if (ui.screen === 'create') U.drawCreate();
      else drawGame(now);
    } catch (e) {
      console.error(e);
      U.text(1, 0, ` Drawing error: ${e.message} `.slice(0, 98), '#ff6b6b', '#2a0a10');
    }
    if (SF.problems.length && ui.screen === 'title') U.text(1, U.ROWS - 1, ` ${SF.problems.length} content problem(s): see the browser console (F12) `, '#ff9a4a');
    U.flush();
    const dt = nextFrame(now);
    if (dt && (!timer || now + dt < due - 4)) {     // (re)schedule if we need a frame sooner
      clearTimeout(timer);
      due = now + dt;
      timer = setTimeout(() => { timer = null; U.render(); }, dt);
    }
  }

  /* ---------- Fit the grid to the window ---------- */
  function fit() {
    const el = U.screenEl;
    el.style.fontSize = '20px';
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const scale = Math.min((innerWidth - 8) / r.width, (innerHeight - 8) / r.height);
    const px = Math.max(6, 20 * scale);
    el.style.fontSize = px.toFixed(2) + 'px';
    U.fineEl.style.fontSize = (px / 2).toFixed(3) + 'px';    // the tiny-text layer is exactly half size
  }

  /* ---------- Boot ---------- */
  ui.saveInfo = U.readSaveInfo();
  draw();
  fit();
  addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener('beforeunload', U.saveGame);
  addEventListener('pagehide', U.saveGame);
})();

</script>
</body>
</html>
